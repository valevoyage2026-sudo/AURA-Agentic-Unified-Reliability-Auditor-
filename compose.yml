name: aura-system

services:
  # ==========================================
  # Core AURA Backend (FastAPI / LangGraph) - Dev 4 Primary
  # ==========================================
  backend:
    build:
      context: ./aura-system/backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-appdb}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=aura_evidence
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=qwen3.5-9b-64k
      - DEFAULT_MODEL=qwen3.5-9b-64k
      - MAX_ITERATIONS=2
    volumes:
      - ./aura-system/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================
  # PostgreSQL Audit Log Storage (Dev 4 DB)
  # ==========================================
  postgres:
    image: postgres:17
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ==========================================
  # Qdrant Vector Database (Retrieval Layer)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aura-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage


  # ==========================================
  # Redis Cache / State Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data

  # ==========================================
  # pgAdmin DB Management (Dev 4 Audit Inspection)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aura-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # ==========================================
  # Web AURA Frontend (React + Vite)
  # ==========================================
  frontend:
    build:
      context: ./aura-system/frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - "3006:3005"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./aura-system/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  pgadmin-data:
